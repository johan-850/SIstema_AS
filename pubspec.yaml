name: abarroteria_pro
description: "Abarrotería Pro — Sistema de Administración POS para Tienda de Abarrotes"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # ── UI / Design ─────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.2

  # ── State Management ────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ── Supabase ────────────────────────────────────────────────────────────
  supabase_flutter: ^2.8.4

  # ── Navigation ──────────────────────────────────────────────────────────
  go_router: ^14.6.3

  # ── Local Storage (Offline / Secure) ────────────────────────────────────
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.27
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # ── Bluetooth & Barcode ─────────────────────────────────────────────────
  flutter_blue_plus: ^1.35.5
  mobile_scanner: ^5.2.3

  # ── PDF & Printing ───────────────────────────────────────────────────────
  pdf: ^3.11.1
  printing: ^5.13.2
  open_filex: ^4.5.0

  # ── Charts & Analytics ──────────────────────────────────────────────────
  fl_chart: ^0.69.0

  # ── Push Notifications ──────────────────────────────────────────────────
  firebase_core: ^3.9.0
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1

  # ── Image Handling ──────────────────────────────────────────────────────
  image_picker: ^1.1.2
  image_cropper: ^8.0.2

  # ── CSV / Excel Export ───────────────────────────────────────────────────
  csv: ^6.0.0
  share_plus: ^10.1.4
  file_picker: ^8.1.7

  # ── Connectivity & Network ───────────────────────────────────────────────
  connectivity_plus: ^6.1.3
  http: ^1.2.2

  # ── Utilities ───────────────────────────────────────────────────────────
  intl: ^0.20.1
  equatable: ^2.0.7
  uuid: ^4.5.1
  collection: ^1.19.1
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  vibration: ^2.0.0
  audioplayers: ^6.1.0
  flutter_dotenv: ^5.2.1
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # ── Code Generation ──────────────────────────────────────────────────────
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  freezed: ^3.0.6
  json_serializable: ^6.9.4
  drift_dev: ^2.22.1
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/fonts/
    - .env

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
